{% extends "base.html" %}
{% block contenido %}
<div class="container mt-4">
    <h2>Crear pedido #{{ pedido_id }}</h2>
    
    <form method="POST" id="pedidoForm">
        {% csrf_token %}
        
        <div class="card mb-3">
            <div class="card-header">📋 Datos del cliente</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label>Cliente *</label>
                        <input type="text" name="Cliente" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Teléfono *</label>
                        <input type="text" name="Telefono" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label>Club</label>
                        <input type="text" name="Club" class="form-control">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Fecha estimada de entrega</label>
                        <input type="date" name="Fecha_entrega_estimada" class="form-control" value="{{ fecha_hoy }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label>Fecha de entrada</label>
                        <input type="date" name="Fecha_entrada" class="form-control" value="{{ fecha_hoy }}">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Comentarios</label>
                        <textarea name="Comentarios" class="form-control" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">📊 Estados</div>
            <div class="card-body">
                {% for estado in estados %}
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="Estados" value="{{ estado }}" id="estado_{{ forloop.counter }}">
                    <label class="form-check-label" for="estado_{{ forloop.counter }}">{{ estado }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">📦 Productos</div>
            <div class="card-body">
                <table class="table" id="productosTable">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Tejido</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="productosBody">
                    </tbody>
                </table>
                <button type="button" class="btn btn-sm btn-primary" onclick="agregarProducto()">➕ Añadir producto</button>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">💰 Facturación</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label>Precio</label>
                        <input type="text" name="Precio" class="form-control" id="totalPedido" readonly>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label>Precio factura</label>
                        <input type="text" name="Precio_factura" class="form-control">
                    </div>
                    <div class="col-md-4 mb-2">
                        <label>Total pedido: <span id="totalDisplay">0.00</span>€</label>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label>Forma de pago</label>
                        <select name="Forma_pago" class="form-control">
                            <option value="">— Seleccionar —</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Bizum">Bizum</option>
                            <option value="Efectivo">Efectivo</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label>Pago adelantado</label>
                        <input type="number" name="Pago_adelantado" class="form-control" step="0.01" value="0">
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-success">💾 Guardar</button>
            <a href="/pedidos/" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<!-- Templates ocultos para productos -->
<template id="productoTemplate">
    <tr class="producto-row">
        <td>
            <select name="producto_nombre_{index}" class="form-control producto-nombre">
                <option value="">— Seleccionar producto —</option>
                {% for prod in productos_disponibles %}
                <option value="{{ prod }}">{{ prod }}</option>
                {% endfor %}
            </select>
        </td>
        <td>
            <select name="producto_tejido_{index}" class="form-control producto-tejido">
                <option value="">— Seleccionar tejido —</option>
                {% for tejido in tejidos_disponibles %}
                <option value="{{ tejido }}">{{ tejido }}</option>
                {% endfor %}
            </select>
        </td>
        <td>
            <input type="number" name="producto_cantidad_{index}" class="form-control producto-cantidad" step="1" value="0" min="0">
        </td>
        <td>
            <input type="number" name="producto_precio_{index}" class="form-control producto-precio" step="0.01" value="0" min="0">
        </td>
        <td class="producto-subtotal">0.00€</td>
        <td>
            <button type="button" class="btn btn-sm btn-danger" onclick="eliminarProducto(this)">🗑️</button>
        </td>
    </tr>
</template>

<script>
let productoIndex = 0;

function agregarProducto() {
    const template = document.getElementById('productoTemplate');
    const tbody = document.getElementById('productosBody');
    const row = template.content.cloneNode(true);
    
    // Reemplazar {index} con el índice actual
    row.querySelectorAll('[name*="{index}"]').forEach(el => {
        el.name = el.name.replace('{index}', productoIndex);
    });
    
    tbody.appendChild(row);
    productoIndex++;
}

function eliminarProducto(btn) {
    btn.closest('tr').remove();
    calcularTotal();
}

// Calcular subtotales y total
document.addEventListener('input', function(e) {
    if (e.target.classList.contains('producto-cantidad') || e.target.classList.contains('producto-precio')) {
        const row = e.target.closest('tr');
        const cantidad = parseFloat(row.querySelector('.producto-cantidad').value) || 0;
        const precio = parseFloat(row.querySelector('.producto-precio').value) || 0;
        const subtotal = cantidad * precio;
        
        row.querySelector('.producto-subtotal').textContent = subtotal.toFixed(2) + '€';
        calcularTotal();
    }
});

function calcularTotal() {
    let total = 0;
    document.querySelectorAll('.producto-row').forEach(row => {
        const cantidad = parseFloat(row.querySelector('.producto-cantidad').value) || 0;
        const precio = parseFloat(row.querySelector('.producto-precio').value) || 0;
        total += cantidad * precio;
    });
    
    document.getElementById('totalDisplay').textContent = total.toFixed(2);
    document.getElementById('totalPedido').value = total.toFixed(2);
}

// Agregar primera fila al cargar
agregarProducto();
</script>
{% endblock %}
