<script>
    // URLs base
    const URL_TAREAS_LISTAR = '{% url "tareas_listar" %}';
    const URL_TAREAS_GUARDAR = '{% url "tareas_guardar" %}';

    // ===== CSRF SEGURO (método oficial Django) =====
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // ===== CARGAR TAREAS =====
    function cargarTareas() {
        fetch(URL_TAREAS_LISTAR)
            .then(response => {
                if (!response.ok) throw new Error("Error HTTP " + response.status);
                return response.json();
            })
            .then(data => {
                const tareasPendientes = data.tareas.filter(t => !t.completada);
                const tareasCompletadas = data.tareas.filter(t => t.completada);

                renderTareas(tareasPendientes, tareasCompletadas);
            })
            .catch(error => {
                console.error('Error al cargar tareas:', error);
                document.getElementById('tareasPendientes').innerHTML =
                    '<div style="padding:20px;text-align:center;color:#dc3545;background:white;border-radius:4px;">❌ Error al cargar tareas</div>';
            });
    }

    function renderTareas(pendientes, completadas) {
        const contPend = document.getElementById('tareasPendientes');
        const contComp = document.getElementById('tareasCompletadas');

        document.getElementById('tareasPendientesCount').textContent = pendientes.length;
        document.getElementById('tareasCompletadasCount').textContent = completadas.length;

        contPend.innerHTML = pendientes.length === 0
            ? '<div style="padding:20px;text-align:center;color:#6c757d;background:white;border-radius:4px;">📭 No hay tareas pendientes</div>'
            : pendientes.map(t => `
                <div style="background:white;padding:15px;margin-bottom:10px;border-radius:4px;border-left:4px solid #007bff;">
                    <h4>${t.cliente_club}</h4>
                    <p>${t.descripcion}</p>
                    <small>Creada: ${new Date(t.fecha_creacion).toLocaleString()}</small>
                    <div style="margin-top:10px;">
                        <button onclick="completarTarea('${t.id}')" style="margin-right:5px;">✓ Completar</button>
                        <button onclick="eliminarTarea('${t.id}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');

        contComp.innerHTML = completadas.length === 0
            ? '<div style="padding:20px;text-align:center;color:#6c757d;background:white;border-radius:4px;">📭 No hay tareas completadas</div>'
            : completadas.map(t => `
                <div style="background:white;padding:15px;margin-bottom:10px;border-radius:4px;border-left:4px solid #28a745;opacity:0.7;">
                    <h4>${t.cliente_club}</h4>
                    <p>${t.descripcion}</p>
                    <small>Completada: ${t.fecha_completada ? new Date(t.fecha_completada).toLocaleString() : '—'}</small>
                    <div style="margin-top:10px;">
                        <button onclick="eliminarTarea('${t.id}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
    }

    // ===== CREAR TAREA =====
    document.getElementById('formTarea').addEventListener('submit', function(e) {
        e.preventDefault();

        const cliente_club = document.getElementById('cliente_club').value.trim();
        const descripcion = document.getElementById('descripcion').value.trim();

        if (!cliente_club || !descripcion) {
            alert("Campos obligatorios");
            return;
        }

        fetch(URL_TAREAS_GUARDAR, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrftoken
            },
            body: `cliente_club=${encodeURIComponent(cliente_club)}&descripcion=${encodeURIComponent(descripcion)}`
        })
        .then(response => {
            if (!response.ok) throw new Error("Error HTTP " + response.status);
            return response.json();
        })
        .then(data => {
            if (data.success) {
                document.getElementById('formTarea').reset();
                cargarTareas();
            } else {
                alert(data.error || "Error al guardar");
            }
        })
        .catch(error => {
            console.error("Error al crear tarea:", error);
            alert("Error al crear la tarea");
        });
    });

    // ===== COMPLETAR =====
    function completarTarea(id) {
        fetch(`/pedidos/tareas/completar/${id}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrftoken }
        })
        .then(response => response.json())
        .then(() => cargarTareas());
    }

    // ===== ELIMINAR =====
    function eliminarTarea(id) {
        fetch(`/pedidos/tareas/eliminar/${id}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrftoken }
        })
        .then(response => response.json())
        .then(() => cargarTareas());
    }

    // Cargar al inicio
    document.addEventListener('DOMContentLoaded', cargarTareas);
</script>
